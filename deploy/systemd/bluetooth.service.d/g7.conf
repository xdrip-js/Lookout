# Dexcom G7: start the stock bluetoothd without its GAP plugin.
# After GATT discovery the GAP plugin reads the sensor's Peripheral Preferred
# Connection Parameters (50-75 ms, peripheral latency 40, 6.5 s timeout) and
# applies them to the live link. With latency 40 the sensor may sleep ~3 s
# whenever it has nothing to send, so it misses our J-PAKE replies and hangs
# up (status 0a0300 or a silent drop). The Dexcom app on Android keeps
# latency 0. Found 2026-11-10 by comparing an HCI snoop of the app's pairing
# with ours.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=gap
